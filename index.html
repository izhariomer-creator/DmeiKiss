<style>
:root{
  --paper:#F3F5FA;--card:#FFFFFF;--soft:#EEF2F8;--ink:#141A2B;--dim:#67718A;--faint:#98A2B6;
  --line:#E3E8F1;--line2:#D2DAE8;
  --c1:#7B87A2;--c2:#00BFA6;--c3:#7C5CFF;--c4:#FF4D8D;--gold:#FFB020;--gold2:#FF7A1E;--good:#0FB981;
  --sh:0 1px 0 rgba(20,26,43,.03),0 10px 26px -16px rgba(20,26,43,.30);
  --disp:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --ui:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --hA:#00BFA6;--hB:#7C5CFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#F3F5FA}
body{margin:0;background:radial-gradient(90% 34% at 50% -6%,color-mix(in srgb,var(--hA) 22%,transparent),transparent 70%),var(--paper);
  background-attachment:fixed;color:var(--ink);font-family:var(--ui);font-size:16px;
  line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}
:focus-visible{outline:2.5px solid var(--hB);outline-offset:2px;border-radius:10px}
.wrap{max-width:540px;margin:0 auto;padding:0 16px calc(44px + env(safe-area-inset-bottom))}
#fx{position:fixed;inset:0;pointer-events:none;z-index:65}

.hd{display:flex;align-items:center;gap:11px;padding:14px 0 10px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--paper) 72%,rgba(243,245,250,0))}
.hd .who{display:flex;align-items:center;gap:11px;min-width:0;flex:1;text-align:left}
.hd .nm{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:-.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .sm{font-size:12.5px;color:var(--dim);margin-top:-3px}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:var(--card);border:1px solid var(--line);color:var(--dim);box-shadow:var(--sh);position:relative}
.ico:active{transform:scale(.92)}
.ico svg{width:19px;height:19px}
.ico .bdg{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--c4);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--paper)}
.av{border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--soft)}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* hero */
.hero{border-radius:28px;padding:22px 22px 20px;margin-bottom:22px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--hA),var(--hB));
  box-shadow:0 18px 40px -20px var(--hB)}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-110px;
  background:rgba(255,255,255,.14)}
.hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;left:-60px;bottom:-90px;
  background:rgba(255,255,255,.10)}
.hero .blob{position:absolute;width:120px;height:120px;border-radius:50%;right:40px;bottom:-70px;background:rgba(255,255,255,.09);z-index:0}
.hero>*{position:relative;z-index:1}
.hero .cap{font-size:13px;opacity:.88;font-weight:500}
.hero .big{font-family:var(--disp);font-weight:800;font-size:66px;line-height:.95;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;margin:4px 0 14px;display:flex;align-items:baseline;gap:3px}
.hero .big .cur{font-size:34px;font-weight:700;opacity:.65;letter-spacing:-.03em}
.stats{display:flex;gap:8px}
.stat{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;backdrop-filter:blur(4px)}
.stat .v{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.03em;line-height:1.05;
  font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;opacity:.85;margin-top:2px}
.gl{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:13px;
  border-top:1px solid rgba(255,255,255,.3)}
.gl .k{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:-.02em}
.gl .v{font-size:12.5px;opacity:.85;margin-left:auto}

/* sections */
.sh{display:flex;align-items:center;gap:10px;margin:0 2px 11px}
.sh .sd{display:none}
.sh h2{font-family:var(--disp);font-size:14px;font-weight:800;letter-spacing:.01em;margin:0;color:#fff;
  padding:6px 13px;border-radius:99px;background:var(--secc,var(--ink));box-shadow:0 6px 14px -8px var(--secc,var(--ink))}
.sh .rule{flex:1;height:1.5px;background:var(--line);border-radius:2px}
.sh .n{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;font-weight:600}

/* rows */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  margin-bottom:22px;box-shadow:var(--sh)}
.t{display:flex;align-items:stretch;border-top:1px solid var(--line);transition:background .18s}
.panel .t:first-child{border-top:0}
.t{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.t .tile{width:66px;flex:none;display:grid;place-items:center;pointer-events:none}
.t .tile i{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;transition:.18s;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.t.on .tile i{box-shadow:0 8px 16px -8px currentColor}
.t .tile svg{width:23px;height:23px;stroke-width:1.75}
.t .body{flex:1;display:flex;align-items:center;gap:12px;padding:15px 4px 15px 0;min-width:0;text-align:left;pointer-events:none}
.t .hit{position:absolute;inset:0;z-index:3}
.t{position:relative}
.t .mid{flex:1;min-width:0}
.t .nm,.t .sub{display:block}
.t .nm{font-weight:560;font-size:15.5px;letter-spacing:-.008em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .sub{font-size:12.5px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .val{font-family:var(--disp);font-weight:700;font-size:16.5px;flex:none;font-variant-numeric:tabular-nums;
  letter-spacing:-.025em;color:var(--dim)}
.tick{width:32px;height:32px;border-radius:50%;flex:none;border:2px solid var(--line2);display:grid;
  place-items:center;color:#fff;font-family:var(--disp);font-weight:800;font-size:13.5px;transition:.18s}
.tick svg{width:15px;height:15px;stroke-width:3}
.t:active{background:var(--soft)}
.t.on .nm{color:var(--ink)} .t.on .tick{border-color:transparent}
.t.on .val{color:#fff;padding:3px 9px;border-radius:99px;font-size:14px}
.t.on.b1 .val{background:var(--c1)} .t.on.b2 .val{background:var(--c2)} .t.on.b3 .val{background:var(--c3)} .t.on.b4 .val{background:var(--c4)}
.tile i.k1{background:rgba(123,135,162,.14);color:var(--c1)} .tile i.k2{background:rgba(0,191,166,.14);color:var(--c2)}
.tile i.k3{background:rgba(124,92,255,.13);color:var(--c3)} .tile i.k4{background:rgba(255,77,141,.12);color:var(--c4)}
.t.on .tile i.k1{background:var(--c1);color:#fff} .t.on .tile i.k2{background:var(--c2);color:#fff}
.t.on .tile i.k3{background:var(--c3);color:#fff} .t.on .tile i.k4{background:var(--c4);color:#fff}
.t.on.b1{background:rgba(123,135,162,.07)} .t.on.b1 .tick{background:var(--c1)}
.t.on.b2{background:rgba(0,191,166,.07)} .t.on.b2 .tick{background:var(--c2)}
.t.on.b3{background:rgba(124,92,255,.06)} .t.on.b3 .tick{background:var(--c3)}
.t.on.b4{background:rgba(255,77,141,.06)} .t.on.b4 .tick{background:var(--c4)}
.t .cam2{width:42px;flex:none;display:grid;place-items:center;position:relative;z-index:4;
  color:var(--faint);transition:.16s}
.t .cam2 svg{width:19px;height:19px;stroke-width:1.9}
.t .cam2:active{transform:scale(.86)}
.t .cam2.has{color:var(--good)}
.t .cam2.has::after{content:"";position:absolute;top:7px;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--good);border:2px solid var(--card)}
.t.on .cam2{color:var(--dim)} .t.on .cam2.has{color:var(--good)}
.gold .gcam{margin-left:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.6);color:#B35A00;position:relative;z-index:1}
.gold .gcam svg{width:20px;height:20px;stroke-width:1.9}
.gold .gcam:active{transform:scale(.9)}
.gold .gcam.has{background:var(--good);color:#fff}
.gold .gcam+.gb{margin-left:10px}
.pop{animation:pp .38s cubic-bezier(.2,1.5,.4,1)}
@keyframes pp{45%{transform:scale(1.25) rotate(-6deg)}}
.today{display:inline-block;font-size:11px;font-weight:700;color:var(--good);background:rgba(15,185,129,.12);
  padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}

/* golden */
.gold{position:relative;border-radius:24px;padding:18px;margin-bottom:12px;overflow:hidden;
  background:linear-gradient(140deg,#FFF6E3,#FFEFD6);border:1.5px solid #FFD99A;
  box-shadow:0 10px 26px -18px rgba(255,138,30,.9)}
.gold::after{content:"";position:absolute;top:0;left:-55%;width:38%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
  animation:sheen 6s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,74%{left:-55%}100%{left:125%}}
.gold .gt{display:flex;gap:13px;text-align:left;width:100%;position:relative;z-index:1}
.gold .gtile{width:46px;height:46px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--gold),var(--gold2));color:#fff;box-shadow:0 6px 14px -6px rgba(255,122,30,.9)}
.gold .gtile svg{width:24px;height:24px;stroke-width:1.9}
.gold h3{margin:0;font-family:var(--disp);font-size:17.5px;font-weight:700;letter-spacing:-.025em;line-height:1.2;color:#6B3D00}
.gold p{margin:4px 0 0;font-size:13px;color:#96662B;line-height:1.4}
.gold .gf{display:flex;align-items:center;gap:12px;margin-top:16px;position:relative;z-index:1}
.gold .gv{font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:-.04em;color:#B35A00;font-variant-numeric:tabular-nums}
.gold .gb{margin-left:auto;padding:11px 20px;border-radius:99px;font-weight:650;font-size:14.5px;
  background:linear-gradient(145deg,var(--gold),var(--gold2));color:#fff;box-shadow:0 6px 14px -7px rgba(255,122,30,1)}
.gold .gb:active{transform:scale(.96)}
.gold.on{background:linear-gradient(140deg,#FFE9B8,#FFD9A0);border-color:#FFB020}
.gold.on .gb{background:rgba(107,61,0,.13);color:#6B3D00;box-shadow:none}

/* photo on a tick */
.en .cam{width:28px;height:28px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--line)}
.en .addp{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--dim);display:grid;place-items:center;flex:none}
.en .addp svg{width:15px;height:15px;stroke-width:1.9}
.en .addp:active{transform:scale(.9)}

/* statement */
.bars{display:flex;align-items:flex-end;gap:7px;height:110px;padding:10px 12px 0;
  background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);margin-bottom:8px}
.bars .bk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .bv{width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--hA),var(--hB));min-height:3px;
  animation:rise2 .5s cubic-bezier(.2,.9,.3,1)}
.bars .bk.zero .bv{background:var(--line2)}
.bars .bl{font-size:9.5px;color:var(--faint);white-space:nowrap}
@keyframes rise2{from{height:0}}
.barsfoot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin:0 4px 22px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:22px}
.sum .c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 12px;box-shadow:var(--sh)}
.sum .c .v{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.sum .c .l{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.25}
.sum .c .x{font-size:11px;color:var(--faint);margin-top:3px}
.bd{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:1px solid var(--line)}
.panel .bd:first-child{border-top:0}
.bd i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.bd i svg{width:18px;height:18px;stroke-width:1.8}
.bd .bn{flex:1;min-width:0;font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd .bc{font-size:12px;color:var(--faint);flex:none}
.bd .ba{font-family:var(--disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;flex:none;min-width:54px;text-align:right}
.en .cam{width:26px;height:26px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line)}
.en .addp{width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--dim);display:grid;place-items:center;flex:none}
.en .addp svg{width:14px;height:14px;stroke-width:1.9}

/* trophies */
.tstrip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:-6px 0 18px;scrollbar-width:none}
.tstrip::-webkit-scrollbar{display:none}
.tstrip .tm{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.tstrip .tm .tn{font-size:10.5px;color:var(--dim);font-weight:600;text-align:center;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.tstrip .tm.lock{opacity:.38;filter:grayscale(1)}
.medal{position:relative;display:grid;place-items:center}
.medal svg.mb{width:100%;height:100%;display:block}
.medal .mi{position:absolute;color:#fff;width:42%;height:42%}
.medal .mi svg{width:100%;height:100%}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}
.tgrid .tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tgrid .tm .tn{font-weight:700;font-size:13px;letter-spacing:-.01em}
.tgrid .tm .tt{font-size:11px;color:var(--dim);line-height:1.25}
.tgrid .tm.lock{opacity:.4;filter:grayscale(1)}
.reveal{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);
  top:calc(8px + env(safe-area-inset-top));z-index:60;width:min(94vw,420px);
  display:flex;align-items:center;gap:13px;padding:11px 16px 11px 12px;border-radius:20px;
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 14px 34px -12px rgba(20,26,43,.42);animation:slidein .34s cubic-bezier(.2,1.1,.3,1)}
@keyframes slidein{from{transform:translateX(-50%) translateY(-22px);opacity:0}}
.reveal .cap{font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--gold2);text-transform:uppercase}
.reveal .medal{flex:none;animation:drop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{0%{transform:scale(.3) rotate(-25deg);opacity:0}60%{transform:scale(1.14) rotate(5deg)}100%{transform:none;opacity:1}}
.reveal .txt{flex:1;min-width:0}
.reveal h2{font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:-.03em;margin:1px 0 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reveal p{color:var(--dim);font-size:12.5px;margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reveal .btn{display:none}
.reveal .bar{position:absolute;left:16px;right:16px;bottom:6px;height:3px;border-radius:9px;
  background:rgba(20,26,43,.10);overflow:hidden}
.reveal .bar i{display:block;height:100%;background:var(--gold2);opacity:.6;animation:drain 2.4s linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.reveal .bar i{animation-duration:3s}
.reveal+.reveal{display:none}

/* buttons etc */
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:650;font-size:15.5px;text-align:center;
  background:var(--ink);color:#fff;margin-top:11px;letter-spacing:-.01em;box-shadow:var(--sh)}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.d{background:#FFF1F5;color:#D91E5B;border:1px solid #FFD3E1}
.btn.au{background:linear-gradient(145deg,var(--gold),var(--gold2));color:#fff;box-shadow:0 10px 22px -12px rgba(255,122,30,1)}
.btn:active{transform:scale(.99);opacity:.92}
.empty{color:var(--faint);font-size:14px;padding:22px 18px;text-align:center;border:1.5px dashed var(--line2);
  border-radius:22px;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;
  margin-left:7px;vertical-align:2px}
.chip.gold{background:#FFF1D6;color:#B35A00} .chip.new{background:var(--c4);color:#fff}
.chip.loc{background:rgba(0,191,166,.13);color:#087f6e;margin-left:0}
.chip.far{background:#FFF1F5;color:#D91E5B;margin-left:0}
.chip.noloc{background:var(--soft);color:var(--faint);margin-left:0}

/* gate */
.gate{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px 22px;
  background:radial-gradient(70% 48% at 18% 0%,rgba(0,191,166,.16),transparent 72%),
  radial-gradient(70% 48% at 92% 4%,rgba(124,92,255,.16),transparent 72%),var(--paper)}
.gate .mark{font-family:var(--disp);font-weight:800;font-size:44px;letter-spacing:-.05em;line-height:1;text-align:center}
.gate .mark{display:flex;align-items:center;justify-content:center;gap:2px}
.gate .mark .pocket{width:.9em;height:.9em;margin-left:.16em;display:block;
  filter:drop-shadow(0 5px 12px rgba(255,150,20,.5))}
.gate .mark .dash{color:var(--gold);opacity:.7}
.gate .tag{color:var(--dim);font-size:15px;margin:11px 0 46px;text-align:center}
.faces{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.face{display:flex;flex-direction:column;align-items:center;gap:11px;width:106px}
.face .ring{padding:4px;border-radius:50%;background:var(--card);box-shadow:var(--sh)}
.face .fn{font-weight:650;font-size:15.5px}
.face .fm{font-size:12.5px;color:var(--dim);margin-top:-8px;font-variant-numeric:tabular-nums;font-weight:600}
.face:active .ring{transform:scale(.94)}
.reg{width:100%;max-width:392px;background:var(--card);border:1px solid var(--line);border-radius:26px;
  padding:22px;box-shadow:var(--sh);text-align:left}
.reg h3{margin:0 0 5px;font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:-.03em}
.reg .note{color:var(--dim);font-size:13.5px;margin:0 0 18px;line-height:1.45}
.reg .regav{display:flex;justify-content:center;margin-bottom:15px}
.roles{display:flex;gap:10px}
.roles button{flex:1;padding:13px;border-radius:13px;border:1.5px solid var(--line);background:var(--soft);font-weight:650}
.roles button.sel{border-color:var(--hB);background:var(--card);box-shadow:var(--sh)}
a.btn{text-decoration:none}
.sum .c.tap:active{transform:scale(.97)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,26,43,.42);backdrop-filter:blur(5px);z-index:50;display:flex;
  align-items:flex-end;justify-content:center;animation:fade .17s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:26px 26px 0 0;
  padding:12px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;
  animation:rise .26s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(26px)}}
@media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:26px;max-height:86vh}}
.grip{width:40px;height:4.5px;border-radius:9px;background:var(--line2);margin:0 auto 16px}
.sheet h3{margin:0 0 5px;font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:-.03em}
.sheet .note{color:var(--dim);font-size:14px;margin:0 0 18px;line-height:1.45}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;font-weight:550}
.fld input,.fld select{width:100%;padding:13px;border-radius:13px;border:1.5px solid var(--line);background:var(--soft);outline:none}
.fld input:focus,.fld select:focus{border-color:var(--hB);background:var(--card)}
.two{display:flex;gap:11px}.two>*{flex:1}
.kv{display:flex;align-items:center;gap:13px;padding:14px;border-radius:18px;background:var(--soft);margin-bottom:14px}
.kv i{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none}
.kv i svg{width:23px;height:23px;stroke-width:1.8}
.kv .kvv{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.025em}
.kv .kvs{font-size:12.5px;color:var(--dim)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:9px;max-height:186px;overflow-y:auto;padding:3px}
.pick button{aspect-ratio:1;border-radius:15px;background:var(--soft);border:2px solid transparent;display:grid;place-items:center;font-size:24px}
.pick button svg{width:22px;height:22px;stroke-width:1.75;color:var(--dim)}
.pick button.sel{border-color:var(--hB);background:rgba(124,92,255,.1)}
.pick button.sel svg{color:var(--hB)}
.hues{display:flex;gap:10px;flex-wrap:wrap}
.hues button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.hues button.sel{border-color:var(--ink)}
.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin:4px 0 14px}
.thumbs .tw{position:relative}
.thumbs img{width:80px;height:80px;object-fit:cover;border-radius:15px;border:1px solid var(--line);display:block}
.thumbs .tw>button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--c4);
  color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}

/* entries / feed / payments */
.pr{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);
  margin-bottom:11px;width:100%;text-align:left;box-shadow:var(--sh)}
.pr .nm{font-family:var(--disp);font-weight:700;font-size:18.5px;letter-spacing:-.025em}
.pr .sub{font-size:12.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .sub.paid{font-weight:600}
.pr .amt{margin-left:auto;font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pr .amt.pay{color:var(--good)}
.dayh{font-size:12.5px;font-weight:650;color:var(--dim);margin:14px 4px 7px}
.en{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.panel .en:first-child{border-top:0}
.en i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.en i svg{width:19px;height:19px;stroke-width:1.8}
.en .em{flex:1;min-width:0}
.en .nm{font-weight:550;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.en .sub{font-size:12px;color:var(--faint);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.en .val{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--good);font-variant-numeric:tabular-nums;flex:none}
.en .x{width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--dim);display:grid;place-items:center;
  font-size:14px;font-weight:700;flex:none}
.sug{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:11px;box-shadow:var(--sh)}
.sug .by{font-size:12.5px;color:var(--dim);margin-bottom:3px}
.sug .nm{font-weight:650;font-size:16.5px}
.sug .no{font-size:13px;color:var(--dim);margin-top:3px}
.sug .ac{display:flex;gap:9px;margin-top:14px}
.sug .ac button{flex:1;padding:12px;border-radius:13px;font-weight:650;font-size:14.5px}
.sug .yes{background:var(--good);color:#fff} .sug .no2{background:var(--soft);border:1px solid var(--line)}

.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:34px;z-index:70;background:var(--ink);color:#fff;
  padding:12px 21px;border-radius:99px;font-weight:650;font-size:14.5px;box-shadow:0 12px 30px -10px rgba(20,26,43,.6);
  animation:pop .3s cubic-bezier(.2,1.3,.4,1);max-width:90vw;text-align:center}
.toast.bad{background:#D91E5B}
@keyframes pop{from{transform:translateX(-50%) translateY(14px) scale(.9);opacity:0}}
.foot{font-size:12.5px;color:var(--faint);text-align:center;margin-top:22px;line-height:1.55}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>

function dist(a,b){if(!a||!b)return null;var R=6371000,toR=Math.PI/180;
  var dl=(b.lat-a.lat)*toR,dn=(b.lng-a.lng)*toR;
  var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dn/2)*Math.sin(dn/2);
  return 2*R*Math.asin(Math.sqrt(h));}
function locChip(e){
  if(!e.lat)return '';

  if(d==null)return '<span class="chip loc">located</span>';
  if(d<=(S.home.radius||200))return '<span class="chip loc">at home</span>';
  return '<span class="chip far">'+(d<1000?Math.round(d)+" m":(d/1000).toFixed(1)+" km")+' from home</span>';
}

function getPos(cb){
  if(LOCOFF||!navigator.geolocation){cb(null);return;}
  var done=false;
  navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;LOCOFF=false;
    cb({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)});},
    function(err){if(done)return;done=true;
      if(err&&(err.code===1||err.code===2))LOCOFF=true;   /* blocked or unavailable: stop asking every tick */
      cb(null);},{timeout:7000,maximumAge:120000});
}

function burst(x,y,cols,big){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;

  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.985;p.life-=.022;p.rot+=p.vr;
    FXc.save();FXc.globalAlpha=Math.max(0,p.life);FXc.translate(p.x,p.y);FXc.rotate(p.rot);

/* ---------- statement ---------- */
function wkStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x;}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function wkKey(t){return iso(wkStart(new Date(t)));}
function moKey(t){var d=new Date(t);return d.getFullYear()+"-"+d.getMonth();}
function history(k,payments){
  var out=entries(k).map(function(e){return e;}),lostN=0,lostA=0,first=0;
  (payments||[]).forEach(function(r){
    var d=r.data;if(!d||d.kid!==k)return;
    var es=d.entries||[];
    if(es.length)es.forEach(function(e){out.push(e);});
    else{lostN+=(d.count||0);lostA+=(d.amount||0);}   /* an older payday that kept no task list */
    var f=d.from||d.at;if(f&&(!first||f<first))first=f;
  });
  out.forEach(function(e){if(e.at&&(!first||e.at<first))first=e.at;});
  return {list:out,lostN:lostN,lostA:lostA,first:first};
}
function sumIn(list,pred){var n=0,a=0;list.forEach(function(e){if(pred(e)){n++;a+=e.amount;}});return {n:n,a:a};}
function vStatement(v){
  var k=S.ctx.kid||S.me,K=kid(k);setTheme(K);
  v.appendChild(el('<div class="empty">Loading</div>'));
  colGet("payments").then(function(rows){
    v.innerHTML="";
    var mine=rows.filter(function(r){return r.data&&r.data.kid===k;}).sort(function(a,b){return b.data.at-a.data.at;});
    var H=history(k,rows),all=H.list;
    var owed=owedAll(k);
    var paid=mine.reduce(function(s,r){return s+(r.data.amount||0);},0);
    var thisW=sumIn(all,function(e){return wkKey(e.at)===wkKey(Date.now());});
    var thisM=sumIn(all,function(e){return moKey(e.at)===moKey(Date.now());});
    var startAt=H.first||Date.now();
    var weeks=Math.max(1,Math.floor((Date.now()-wkStart(new Date(startAt)).getTime())/604800000)+1);
    var avg=Math.round((paid+owed)/weeks);
    var tasksEver=all.length+H.lostN;

    v.appendChild(el('<div class="hero"><span class="blob"></span><div class="cap">Owed right now</div>'+
      '<div class="big"><span class="cur">'+CUR+'</span><span>'+owed+'</span></div>'+
      '<div class="stats"><div class="stat"><div class="v">'+tasksEver+'</div><div class="l">tasks all time</div></div>'+
      '<div class="stat"><div class="v">'+CUR+paid+'</div><div class="l">paid out</div></div>'+
      '<div class="stat"><div class="v">'+CUR+(paid+owed)+'</div><div class="l">earned ever</div></div></div></div>'));

    v.appendChild(el('<div class="sum">'+

function parentPaid(v,ids){
  colGet("payments").then(function(rows){
    if(!v.isConnected)return;
    var valid=rows.filter(function(r){return r.data&&r.data.at;});
    var month=valid.filter(function(r){return moKey(r.data.at)===moKey(Date.now());})
      .reduce(function(t,r){return t+(r.data.amount||0);},0);
    var last=valid.slice().sort(function(a,b){return b.data.at-a.data.at;})[0];
    var hs=v.querySelector("#phs");
    if(hs){
      hs.children[1].innerHTML='<div class="v">'+CUR+month+'</div><div class="l">paid this month</div>';
      hs.children[2].innerHTML='<div class="v" style="font-size:19px">'+(last?fdate(last.data.at):"never")+'</div>'+
        '<div class="l">'+(last?"last paid "+esc(kid(last.data.kid).name):"no paydays yet")+'</div>';
    }
    ids.forEach(function(k){
      var mine=valid.filter(function(r){return r.data.kid===k;}).sort(function(a,b){return b.data.at-a.data.at;});
      var paid=mine.reduce(function(t,r){return t+(r.data.amount||0);},0);
      var row=v.querySelector('.pr[data-k="'+k+'"] .paid');
      if(!row)return;
      row.textContent=mine.length?("Paid "+CUR+paid+" so far, last on "+fdate(mine[0].data.at)):"Never paid yet";
      row.style.color=mine.length?"var(--good)":"var(--faint)";
    });
  });
}

    lines.push(kid(k).name+": "+es.length+" today ("+CUR+a+"), "+CUR+o+" owed");

    '<div class="fld"><label>Icon</label><div class="pick" id="f-i">'+pk+'</div></div>'+
    '<button class="btn" id="sv">Save</button>'+(isNew?'':'<button class="btn d" id="dl">Delete task</button>')+'<button class="btn g" id="cx">Cancel</button>');
  var chosen=t.icon||"i-star";
  each(s.querySelectorAll("#f-i button"),function(b){b.onclick=function(){chosen=b.getAttribute("data-i");each(s.querySelectorAll("#f-i button"),function(x){x.classList.remove("sel");});b.classList.add("sel");};});
  s.querySelector("#cx").onclick=close_;
  s.querySelector("#sv").onclick=function(){var n=s.querySelector("#f-n").value.trim();if(!n){toast("Give it a name first");return;}
    t.name=n;t.note=s.querySelector("#f-d").value.trim();t.section=s.querySelector("#f-s").value;t.amount=Math.max(0,parseInt(s.querySelector("#f-a").value,10)||0);t.icon=chosen;
    t.max=Math.max(0,parseInt(s.querySelector("#f-m").value,10)||0);
    if(S.tasks.filter(function(x){return x.id===t.id;}).length)S.tasks=S.tasks.map(function(x){return x.id===t.id?t:x;});
    else S.tasks=S.tasks.concat([t]);
    saveTasks();close_();S.view="tasks";S.ctx={title:"Tasks"};render();};
  if(s.querySelector("#dl"))s.querySelector("#dl").onclick=function(){S.tasks=S.tasks.filter(function(x){return x.id!==t.id;});saveTasks();close_();render();toast("Deleted");};
}
function faceOf(per){
  if(per.kidId)return kid(per.kidId);
  return {id:per.id,name:per.name,emoji:S.settings.parentEmoji||"\uD83C\uDFE0",hue:S.settings.parentHue||"#FFB020",parent:true};
}
function vPeople(v){
  var ppl=people();
  if(!ppl.length)v.appendChild(el('<div class="empty">Nobody has registered yet. Send them the link and they set themselves up on their own phone.</div>'));
  ppl.forEach(function(per){
    var f=faceOf(per);f=({id:f.id,name:per.name,emoji:f.emoji,hue:f.hue,parent:!per.kidId});
    var r=el('<button class="pr">'+avatar(f,46)+'<div><div class="nm">'+esc(per.name)+
      (per.id===S.who?'<span class="chip" style="background:var(--soft);color:var(--dim)">this phone</span>':'')+'</div>'+
      '<div class="sub">'+(per.role==="parent"?"Parent":"Kid")+(per.phone?' \u00B7 '+esc(per.phone):'')+'</div></div></button>');
    r.onclick=function(){sheetProfile(f,per);};v.appendChild(r);});
  var claimed=ppl.map(function(x){return x.kidId;});
  var waiting=(S.settings.kids||[]).filter(function(x){return claimed.indexOf(x.id)<0;});
  if(waiting.length){
    v.appendChild(el('<div class="sh" style="--secc:var(--c3)"><h2>Not on a phone yet</h2><span class="rule"></span></div>'));
    waiting.forEach(function(x){
      var r=el('<button class="pr">'+avatar(x,46)+'<div><div class="nm">'+esc(x.name)+'</div>'+
        '<div class="sub">They register with this exact name to pick up their money</div></div></button>');
      r.onclick=function(){sheetProfile(x,null);};v.appendChild(r);});
  }
}
function sheetProfile(p,per){
  var ems=EMOJI.map(function(e){return '<button data-e="'+e+'"'+(p.emoji===e?' class="sel"':'')+'>'+e+'</button>';}).join("");
  var hs=HUES.map(function(h){return '<button data-h="'+h[0]+'" style="background:linear-gradient(145deg,'+h[0]+','+h[1]+')"'+(p.hue===h[0]?' class="sel"':'')+'></button>';}).join("");
  var mine=!!(per&&per.id===S.who);
  var s=sheet('<h3>'+esc(p.name)+'</h3><p class="note">Make it yours. A photo, or a face and your colours. Your colours paint your whole screen.</p>'+
    '<div style="display:flex;justify-content:center;margin-bottom:18px" id="prev"></div>'+
    '<div class="two"><button class="btn g" id="up" style="margin-top:0">Use a photo</button><button class="btn g" id="rm" style="margin-top:0">Use a face</button></div>'+
    '<div class="fld" style="margin-top:16px"><label>Name</label><input id="p-n" value="'+esc(p.name)+'"></div>'+
    (per?'<div class="fld"><label>Phone</label><input id="p-ph" type="tel" inputmode="tel" value="'+esc(per.phone||"")+'"></div>':'')+
    '<div class="fld"><label>Face</label><div class="pick" id="p-e">'+ems+'</div></div>'+
    '<div class="fld"><label>Colours</label><div class="hues" id="p-h">'+hs+'</div></div>'+
    '<button class="btn" id="sv">Save</button>'+
    (mine?'<button class="btn d" id="off">This is not my phone</button>':'')+
    ((per&&!mine&&S.isParent)?'<button class="btn d" id="del">Remove this person</button>':'')+
    '<button class="btn g" id="cx">Cancel</button>');
  if(s.querySelector("#off"))s.querySelector("#off").onclick=function(){close_();leave();};
  if(s.querySelector("#del"))s.querySelector("#del").onclick=function(){
    delete S.people[per.id];docDel("people/"+per.id).then(function(){close_();render();toast("Removed");});};
  var draft={emoji:p.emoji,hue:p.hue,img:S.avatars[p.id]||null};
  function repaint(){var pr=pair(draft.hue),box=s.querySelector("#prev");
    box.innerHTML=draft.img?'<span class="av" style="width:94px;height:94px"><img src="'+draft.img+'" alt=""></span>'
      :'<span class="av" style="width:94px;height:94px;background:linear-gradient(145deg,'+pr[0]+','+pr[1]+')"><span style="font-size:43px;line-height:1">'+(draft.emoji||"\u2728")+'</span></span>';}
  repaint();
  each(s.querySelectorAll("#p-e button"),function(b){b.onclick=function(){draft.emoji=b.getAttribute("data-e");draft.img=null;each(s.querySelectorAll("#p-e button"),function(x){x.classList.remove("sel");});b.classList.add("sel");repaint();};});
  each(s.querySelectorAll("#p-h button"),function(b){b.onclick=function(){draft.hue=b.getAttribute("data-h");each(s.querySelectorAll("#p-h button"),function(x){x.classList.remove("sel");});b.classList.add("sel");repaint();};});
  s.querySelector("#up").onclick=function(){pickFile(function(f){shrink(f,320,0.7).then(function(u){draft.img=u;repaint();}).catch(function(){toast("That photo would not load",true);});});};
  s.querySelector("#rm").onclick=function(){draft.img=null;repaint();};
  s.querySelector("#cx").onclick=close_;
  s.querySelector("#sv").onclick=function(){var nm=s.querySelector("#p-n").value.trim()||p.name;
    var st=editSettings();
    if(p.parent){st.parentEmoji=draft.emoji;st.parentHue=draft.hue;if(!per)st.parentName=nm;}
    else st.kids=(st.kids||[]).map(function(x){return x.id===p.id?{id:x.id,name:nm,emoji:draft.emoji,hue:draft.hue}:x;});
    saveSettings();
    if(per){var up={id:per.id,name:nm,role:per.role,phone:(s.querySelector("#p-ph")?s.querySelector("#p-ph").value.trim():per.phone)||"",kidId:per.kidId||null,at:per.at||Date.now()};
      S.people[per.id]=up;docSet("people/"+per.id,up);}
    if(draft.img){S.avatars[p.id]=draft.img;docSet("avatars/"+p.id,{img:draft.img});}else{delete S.avatars[p.id];docDel("avatars/"+p.id);}
    if((S.me===p.id)||(S.isParent&&p.parent))setTheme({hue:draft.hue});close_();render();toast("Saved");};
}

/* ---------- sheet / toast ---------- */
function sheet(h){var m=document.getElementById("modal");m.innerHTML='<div class="scrim"><div class="sheet"><div class="grip"></div>'+h+'</div></div>';
  m.querySelector(".scrim").onclick=function(e){if(e.target===this)close_();};return m.querySelector(".sheet");}
function sheetOpen(){return !!document.querySelector(".scrim");}
function close_(){document.getElementById("modal").innerHTML="";}
var tt;
function toast(m,bad){clearTimeout(tt);var o=document.querySelector(".toast");if(o)o.remove();
  var t=el('<div class="toast'+(bad?" bad":"")+'">'+esc(m)+'</div>');document.body.appendChild(t);tt=setTimeout(function(){t.remove();},bad?3200:1500);}

/* ---------- boot ---------- */
function softRender(){if(sheetOpen())return;render();}
var WATCHED={};
function watchKid(k){
  if(WATCHED[k])return;WATCHED[k]=1;
  watch("ledger/"+k,function(d){
    var next=d||{kid:k,entries:[],since:0,updated:0};
    var cur=S.ledger[k];
    if(cur&&(cur.updated||0)>=(next.updated||0)&&(next.updated||0)>0)return;   /* an echo of what we already have, or older: ignore */
    if(same(next,cur))return;
    var fresh=(next.entries||[]).filter(function(e){return e.at>S.seen&&!(cur&&(cur.entries||[]).some(function(o){return o.id===e.id;}));});
    S.ledger[k]=next;
    if(S.isParent){if(S.view==="parent"){paintFeed();markSeen();}header();fresh.forEach(function(e){notify(k,e);});if(S.view==="review"&&!sheetOpen())render();}
    else if(S.me===k){if(sheetOpen())return;if(S.view==="home")patchHome(k);else render();}
  });
  watch("avatars/"+k,function(d){var img=(d&&d.img)||null;if(img===(S.avatars[k]||null))return;if(img)S.avatars[k]=img;else delete S.avatars[k];softRender();});
}
function watchAllKids(){kidIds().forEach(watchKid);}
function openDb(){
  try{
    if(!window.firebase||!FB_CONFIG||String(FB_CONFIG.projectId).indexOf("PASTE")===0)return Promise.resolve(null);
    firebase.initializeApp(FB_CONFIG);
    var d=firebase.firestore();
    return d.enablePersistence({synchronizeTabs:true}).catch(function(){}).then(function(){return d;});
  }catch(e){logErr("firebase",e);return Promise.resolve(null);}
}
function seedIfEmpty(){
  if(!db||!window.SEED)return Promise.resolve();
  return db.doc("config/settings").get().then(function(sn){
    if(sn&&sn.exists)return;                       /* already has data, never touch it */
    var jobs=Object.keys(SEED).map(function(path){return db.doc(path).set(SEED[path]);});
    return Promise.all(jobs).then(function(){toast("Your Dmei-Kiss history is in");});
  }).catch(function(e){logErr("seed",e);});
}
function boot(){
  drawGate();
  openDb().then(function(h){
    db=h||null;
    if(!db)setTimeout(function(){toast("No database yet, this phone is saving on its own",true);},1200);
    return seedIfEmpty();
  }).then(function(){
    watch("config/settings",function(d){var next=(d&&d.kids&&d.kids.length)?d:DEF;if(same(next,S.settings))return;S.settings=next;if(!d)docSet("config/settings",DEF);watchAllKids();softRender();});
    watch("config/tasks",function(d){var next=(d&&d.items)||[];if(same(next,S.tasks))return;S.tasks=next;softRender();});
    watch("config/home",function(d){var next=(d&&d.lat)?d:null;if(same(next,S.home))return;S.home=next;softRender();});
    watchAllKids();
    refreshPeople().then(function(){if(atGate())drawGate();});
    purgePhotos();setTimeout(purgePhotos,6000);setInterval(purgePhotos,1800000);
    refreshSugs();setInterval(refreshSugs,25000);
    setInterval(function(){if(S.isParent)refreshPeople();},30000);
    setInterval(function(){if(S.isParent&&S.view==="parent")paintFeed();},60000);
  });
}
if("serviceWorker" in navigator)addEventListener("load",function(){
  navigator.serviceWorker.register("sw.js").catch(function(){});});
function notify(k,e){try{if(!("Notification" in window)||Notification.permission!=="granted")return;
  new Notification(kid(k).name+" ticked "+e.name,{body:"+"+CUR+e.amount+(e.lat?"":""),tag:"te-"+e.id});}catch(x){}}
function sigOf(list){return list.map(function(x){return x.id;}).sort().join(",");}
function refreshSugs(){colGet("sugs").then(function(r){
  if(sigOf(r)===sigOf(S.sugs))return;S.sugs=r;if(S.isParent&&!sheetOpen())render();});}
function refreshPeople(){
  return colGet("people").then(function(r){
    var m={};r.forEach(function(x){if(x.data&&x.data.id)m[x.data.id]=x.data;});
    var changed=sigOf(r)!==sigOf(people().map(function(x){return {id:x.id};}));
    S.people=m;S.peopleLoaded=true;
    return colGet("avatars").then(function(av){
      av.forEach(function(x){if(x.data&&x.data.img)S.avatars[x.id]=x.data.img;});
      if(changed&&S.isParent&&!sheetOpen()&&S.view==="people")render();
      return m;});
  });
}
window.addEventListener("error",function(ev){showErr("page",ev.error||ev.message);});
window.addEventListener("unhandledrejection",function(ev){showErr("async",ev.reason);});
boot();
})();
</script>
